<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Không tìm thấy · Taolao Lab</title>
<style>
:root { --bg: #F7F6F2; --ink: #15161A; --muted: #6B6D76; --accent: #2347C6; --line: #E3E1DA; }
@media (prefers-color-scheme: dark) { :root { --bg: #111214; --ink: #F1F0EC; --muted: #93949B; --accent: #8EA6FF; --line: #2A2B31; } }
* { box-sizing: border-box; }
body { margin: 0; min-height: 100vh; display: grid; place-items: center; padding: 24px 16px; background: var(--bg); color: var(--ink); font: 400 16px/1.6 system-ui, -apple-system, "Segoe UI", sans-serif; }
main { max-width: 34rem; }
.code { font: 600 13px/1 ui-monospace, monospace; color: var(--muted); letter-spacing: .06em; }
h1 { font-size: clamp(28px, 6vw, 40px); line-height: 1.15; letter-spacing: -.02em; margin: 12px 0 12px; }
p { color: var(--muted); margin: 0 0 24px; }
a { display: inline-block; color: var(--accent); font-weight: 600; text-decoration: none; border-bottom: 1px solid currentColor; }
</style>
</head>
<body>
<main>
  <div class="code">LỖI 404</div>
  <h1>Trang này không tồn tại.</h1>
  <p>Đường dẫn có thể đã thay đổi hoặc trang đã được gỡ. Bạn có thể quay về trang chủ để xem các sản phẩm của Taolao Lab.</p>
  <a href="/">Về trang chủ Taolao Lab</a>
</main>
